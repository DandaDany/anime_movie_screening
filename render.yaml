# Render Blueprint：anime_movie_screening 後台（控制面）
#
# 目前僅保留免費 Web Service。Postgres 已從 Blueprint 移除，避免未來 Blueprint sync
# 重新建立付費資料庫。若日後需要重新啟用持久化後台資料庫，請先重新評估成本後再新增。

services:
  - type: web
    name: muse-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    # 必須綁定 Render 指定的 $PORT，否則 Render 連不到服務、部署會逾時失敗。
    startCommand: "gunicorn movie_map_admin.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      # 自動產生安全的密鑰
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.6"
      # 公開地圖網址（儀表板按鈕用），視需要修改
      - key: PUBLIC_MAP_URL
        value: "https://dandadany.github.io/anime_movie_screening/"
      # 初始管理員帳密：請在 Render 儀表板手動填入（sync:false 代表不寫進 repo）
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
