name: Temporary Taiwan poster source probe
on:
  push:
    branches:
      - fix/japanese-only-film-catalog-20261026
    paths:
      - .github/workflows/japanese-poster-probe-temp.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pillow beautifulsoup4
      - name: Inspect official cinema images without modifying production
        run: |
          python - <<'PY'
          import re,requests,html
          from bs4 import BeautifulSoup
          from PIL import Image
          from io import BytesIO
          from urllib.parse import urljoin,unquote
          urls={
          'haikyu_vieshow':'https://www.vscinemas.com.tw/film/detail.aspx?id=7142',
          'abyss_vieshow':'https://www.vscinemas.com.tw/film/detail.aspx?id=9116',
          'haikyu_miramar':'https://www.miramarcinemas.tw/Movie/Index?type=coming',
          'abyss_showtimes':'https://www.showtimes.com.tw/programs/13158/',
          'haikyu_ptt_poster':'https://i.mopix.cc/WO1W25.jpg',
          'haikyu_gq_old':'https://media.gq.com.tw/photos/660e58f52104160bac013b29/2%3A3/w_2826%2Ch_4239%2Cc_limit/HQM_KV_TW_%E5%85%A8%E5%8F%B0%E4%B8%8A%E6%98%A070x100.jpg'
          }
          for key,url in urls.items():
            try:
              r=requests.get(url,timeout=24,headers={'User-Agent':'Mozilla/5.0'},allow_redirects=True)
              print('PAGE',key,r.status_code,len(r.content),r.url,flush=True)
              c=r.headers.get('Content-Type','')
              if 'image/' in c:
                im=Image.open(BytesIO(r.content));print('IMAGE',key,im.size,im.format,flush=True);continue
              so=BeautifulSoup(r.text,'html.parser')
              items=[]
              for el in so.select('img[src],meta[property="og:image"],img[data-src]'):
                u=el.get('content') or el.get('data-src') or el.get('src')
                alt=el.get('alt','')
                if u:items.append((urljoin(r.url,u),alt))
              for m in re.finditer(r'(?:(?:https?:)?//[^"\'<>\\\s]+|/ForVsWeb/upload/film/[^"\'<>\\\s]+|/upload/movies/[^"\'<>\\\s]+)\.(?:jpg|png|jpeg|webp)',r.text,re.I):
                items.append((urljoin(r.url,html.unescape(m.group(0))),'regex'))
              distinct=[];seen=set()
              for u,a in items:
                if u not in seen:
                  seen.add(u);distinct.append((u,a))
              picked=[(u,a) for u,a in distinct if any(x in u.lower() for x in ['film_','movie','poster','upload','image/data','og:image','photo','haikyu','abyss'])]
              print('CANDIDATES',key,len(distinct),len(picked),flush=True)
              for u,a in picked[:35]:
                print('CANDIDATE',key,u[:300],a[:60],flush=True)
                if (u.lower().endswith(('.jpg','.jpeg','.png','.webp')) or 'film_' in u) and ('film_' in u or 'upload/movies' in u):
                  try:
                    z=requests.get(u,timeout=12,headers={'User-Agent':'Mozilla/5.0'});im=Image.open(BytesIO(z.content));print('DIM',key,im.size,len(z.content),u[:220],flush=True)
                  except Exception as e:print('DIM_ERROR',key,str(e)[:140],flush=True)
            except Exception as e: print('PAGE_ERROR',key,str(e)[:200],flush=True)
          PY
