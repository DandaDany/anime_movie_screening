name: Temporary poster visual source probe
on:
  push:
    branches:
      - fix/japanese-only-film-catalog-20261026
    paths:
      - .github/workflows/japanese-poster-probe-temp.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Thumbnails for manual content verification
        run: |
          python - <<'PY'
          import requests,base64
          from PIL import Image
          from io import BytesIO
          items={'haikyu2026':'https://i.mopix.cc/WO1W25.jpg',
          'haikyu2024':'https://media.gq.com.tw/photos/660e58f52104160bac013b29/2%3A3/w_2826%2Ch_4239%2Cc_limit/HQM_KV_TW_%E5%85%A8%E5%8F%B0%E4%B8%8A%E6%98%A070x100.jpg',
          'abyss_old':'https://miabyss.com/part1_images/news/p_015.jpg'}
          for name,url in items.items():
            try:
              r=requests.get(url,timeout=20,headers={'User-Agent':'Mozilla/5.0'});r.raise_for_status()
              im=Image.open(BytesIO(r.content));print('ORIGINAL',name,im.size,flush=True)
              im=im.convert('RGB');im.thumbnail((340,440));b=BytesIO();im.save(b,format='JPEG',quality=48,optimize=True)
              print('THUMB_START '+name,flush=True)
              print(base64.b64encode(b.getvalue()).decode('ascii'),flush=True)
              print('THUMB_END '+name,flush=True)
            except Exception as e:print('THUMB_ERROR',name,str(e),flush=True)
          PY
