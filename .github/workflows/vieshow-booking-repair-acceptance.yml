name: VIESHOW booking repair acceptance

on:
  push:
    branches:
      - fix/vieshow-booking-publish-race
    paths:
      - .github/workflows/vieshow-booking-repair-acceptance.yml
      - scripts/enrich_vieshow_geojson_booking.py
      - scripts/verify_vieshow_direct_booking.py
      - tests/test_enrich_vieshow_geojson_booking.py
      - tests/test_verify_vieshow_direct_booking.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/vieshow-booking-publish-race

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run unit regressions
        run: |
          python -m unittest             tests.test_enrich_vieshow_geojson_booking             tests.test_verify_vieshow_direct_booking             tests.test_vieshow_booking_links

      - name: Enrich current GeoJSON with VIESHOW session URLs
        run: |
          xvfb-run -a --server-args="-screen 0 1366x900x24"             python scripts/enrich_vieshow_geojson_booking.py --headed

      - name: Verify direct booking links are publishable
        run: python scripts/verify_vieshow_direct_booking.py

      - name: Refresh seat snapshots from repaired booking URLs
        run: |
          xvfb-run -a --server-args="-screen 0 1366x900x24"             python scripts/fetch_vieshow_seat_previews.py --headed

      - name: Commit repaired VIESHOW data to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/locations.geojson web/data/vieshow_seat_previews.json
          if git diff --cached --quiet; then
            echo "No repaired VIESHOW data changes"
          else
            git commit -m "Repair current VIESHOW booking and seat data"
            git push origin HEAD:fix/vieshow-booking-publish-race
          fi
