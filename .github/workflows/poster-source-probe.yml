name: Poster source probe

on:
  push:
    branches:
      - fix/poster-runtime-integrity-20260928
    paths:
      - "scripts/probe_poster_sources.py"
      - ".github/workflows/poster-source-probe.yml"
  pull_request:
    paths:
      - "scripts/probe_poster_sources.py"
      - ".github/workflows/poster-source-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/probe_poster_sources.py
