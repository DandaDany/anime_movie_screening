name: Poster source probe

on:
  pull_request:
    paths:
      - "scripts/probe_poster_sources.py"
      - ".github/workflows/poster-source-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4 pillow
      - run: python scripts/probe_poster_sources.py
