name: Movie library additions acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'data/add-missing-anime-movies-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild discovery and require posters
        run: |
          python scripts/build_movie_discovery_data.py --require-posters
          git diff --exit-code -- web/data/movie_discovery.json
      - name: Movie discovery data tests
        run: |
          python -m unittest discover -s tests -p 'test_movie_discovery_data.py'
          python -m unittest discover -s tests -p 'test_movie_title_matching.py'
      - name: Verify additions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          tracked=json.loads(Path("data/control/tracked_movies.json").read_text())
          posters=json.loads(Path("web/data/movie_posters.json").read_text())
          discovery=json.loads(Path("web/data/movie_discovery.json").read_text())
          expected={
              "角落小夥伴電影版：從天而降的雲之冒險":"2026-10-08",
              "麵包超人電影版：潘坦與約定之星":"2026-10-16",
              "人狼 4K數位修復版":"2026-10-16",
              "名偵探柯南 第30號殺人事件":"2026-11-06",
          }
          active={m["title"]:m for m in tracked["movies"] if m["is_active"]}
          for title,date in expected.items():
              assert title in active, title
              assert active[title]["target_date"] == date, (title, active[title]["target_date"])
          assert len(active) == 25, len(active)
          assert posters["movie_count"] == len(posters["movies"]) == 26
          assert discovery["count"] == 25
          assert discovery["missing_poster_count"] == 0
          assert discovery["missing_posters"] == []
          print("movie library additions: ok")
          PY
