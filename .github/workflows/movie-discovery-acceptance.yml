name: Movie discovery acceptance

on:
  push:
    branches:
      - feature/movie-discovery-home-v1-ready
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build and validate discovery feed
        run: |
          python scripts/build_movie_discovery_data.py --require-posters
          git diff --exit-code -- web/data/movie_discovery.json
          python -m unittest discover -s tests -v
          python -m compileall -q scripts tests
          node --check web/app.js
          node --check web/discovery.js
          node --check web/date-state.js
          node --check web/time-filter.js
          git diff --check

      - name: Start local web server
        run: |
          mkdir -p artifacts
          cd web
          python -m http.server 8765 --bind 127.0.0.1 > ../artifacts/http-server.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Existing map browser regression
        run: python tests/browser_acceptance.py --report artifacts/browser-report.json

      - name: Movie discovery browser acceptance
        run: python tests/browser_movie_discovery_acceptance.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-discovery-acceptance-${{ github.run_id }}
          path: |
            artifacts/*.png
            artifacts/*.json
            artifacts/*.log
          if-no-files-found: warn
          retention-days: 7
