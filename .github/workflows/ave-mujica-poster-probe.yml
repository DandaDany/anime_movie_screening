name: Ave Mujica poster source probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Probe Taiwan poster sources
        shell: python
        run: |
          import io
          import json
          import re
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from urllib.parse import urljoin

          SOURCES = {
              "vieshow": "https://www.vscinemas.com.tw/VsWeb/film/detail.aspx?id=9025",
              "gamme": "https://movie.gamme.com.tw/85116",
              "atmovies": "https://www.atmovies.com.tw/movie/fbjp39335288/",
              "linkgoods": "https://linkgoods.com/museacg",
              "bahamut": "https://acg.gamer.com.tw/acgDetail.php?s=144526",
          }
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155.0.0.0 Safari/537.36",
              "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.8",
          }

          def image_info(url, referer):
              try:
                  r = requests.get(url, headers={**headers, "Referer": referer}, timeout=25, allow_redirects=True)
                  ctype = r.headers.get("content-type", "")
                  if r.status_code != 200 or "image" not in ctype:
                      return {"status": r.status_code, "ctype": ctype, "bytes": len(r.content)}
                  im = Image.open(io.BytesIO(r.content))
                  return {
                      "status": r.status_code,
                      "ctype": ctype,
                      "bytes": len(r.content),
                      "width": im.width,
                      "height": im.height,
                      "format": im.format,
                      "final": r.url,
                  }
              except Exception as exc:
                  return {"error": repr(exc)}

          for name, page_url in SOURCES.items():
              print(f"\n===== SOURCE {name}: {page_url} =====")
              try:
                  r = requests.get(page_url, headers=headers, timeout=30, allow_redirects=True)
                  print("PAGE", r.status_code, r.url, r.headers.get("content-type"), len(r.content))
                  print("TITLE_HINT", "AVE MUJICA" in r.text.upper(), "木棉花" in r.text)
                  soup = BeautifulSoup(r.text, "html.parser")
                  found = []
                  for meta in soup.select('meta[property="og:image"], meta[name="twitter:image"], meta[itemprop="image"]'):
                      raw = (meta.get("content") or "").strip()
                      if raw:
                          found.append(("meta", urljoin(r.url, raw), meta.get("property") or meta.get("name") or meta.get("itemprop")))
                  for img in soup.find_all("img"):
                      raw = ""
                      for key in ("src", "data-src", "data-original", "data-lazy-src", "data-url"):
                          if img.get(key):
                              raw = str(img.get(key)).strip()
                              break
                      if raw:
                          found.append(("img", urljoin(r.url, raw), (img.get("alt") or "")[:160]))
                  for m in re.findall(r'https?://[^\s"\'<>]+?(?:\.jpg|\.jpeg|\.png|\.webp)(?:\?[^\s"\'<>]*)?', r.text, flags=re.I):
                      found.append(("raw", m.replace("&amp;", "&"), "regex"))

                  dedup = []
                  seen = set()
                  for kind, u, label in found:
                      if u in seen:
                          continue
                      seen.add(u)
                      score = 0
                      lu = u.lower()
                      ll = str(label).lower()
                      for token, weight in [
                          ("ave", 8), ("mujica", 8), ("bang", 3), ("9025", 8),
                          ("film_", 7), ("/film/", 5), ("poster", 6), ("movie", 3),
                          ("upload", 3), ("85116", 8), ("fbjp39335288", 8),
                          ("主視覺", 5), ("海報", 5)
                      ]:
                          if token in lu or token in ll:
                              score += weight
                      if kind == "meta":
                          score += 4
                      dedup.append((score, kind, u, label))
                  dedup.sort(reverse=True)

                  for score, kind, u, label in dedup[:40]:
                      print("CANDIDATE", json.dumps({"score": score, "kind": kind, "url": u, "label": label}, ensure_ascii=False))
                      if score >= 4:
                          print("IMAGE_INFO", json.dumps({"url": u, **image_info(u, r.url)}, ensure_ascii=False))
              except Exception as exc:
                  print("PAGE_ERROR", repr(exc))

      - name: Download verified Taiwan poster candidate
        shell: python
        run: |
          import hashlib
          import io
          import requests
          from pathlib import Path
          from PIL import Image

          url = "https://images.gamme.com.tw/movie/2026/41/4/nZySnqOZkaWkrZmW.jpg"
          r = requests.get(url, headers={
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://movie.gamme.com.tw/85116",
          }, timeout=30)
          r.raise_for_status()
          if "image" not in r.headers.get("content-type", ""):
              raise SystemExit(f"not an image: {r.headers.get('content-type')}")
          im = Image.open(io.BytesIO(r.content))
          if (im.width, im.height) != (496, 700):
              raise SystemExit(f"unexpected dimensions: {im.width}x{im.height}")
          out = Path("/tmp/ave-mujica-tw-poster.jpg")
          out.write_bytes(r.content)
          print("POSTER", out, im.width, im.height, im.format, len(r.content), hashlib.sha256(r.content).hexdigest())

      - name: Upload verified poster artifact
        uses: actions/upload-artifact@v4
        with:
          name: ave-mujica-tw-poster
          path: /tmp/ave-mujica-tw-poster.jpg
          if-no-files-found: error
          retention-days: 1
