name: Research VIESHOW official seat handoff

on:
  push:
    branches:
      - research/vieshow-official-seat-handoff
    paths:
      - scripts/research_vieshow_official_seat_handoff.py
      - .github/workflows/research-vieshow-official-seat-handoff.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Inspect official quick-booking handoff
        run: |
          xvfb-run -a --server-args="-screen 0 1366x900x24" \
            python scripts/research_vieshow_official_seat_handoff.py
