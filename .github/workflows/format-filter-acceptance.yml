name: Format filter acceptance

on:
  push:
    branches:
      - research/showtime-format-audit
    paths:
      - web/app.js
      - web/index.html
      - web/styles.css
      - web/version-filter.js
      - scripts/fetch_movie_showtimes.py
      - tests/frontend_version_filter_test.js
      - tests/browser_format_filter_acceptance.py
      - tests/fixtures/format_filter_locations.geojson
      - tests/test_venice_format_versions.py
      - .github/workflows/format-filter-acceptance.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Unit and frontend regression tests
        run: |
          python -m unittest \
            tests.test_venice_format_versions \
            tests.test_ambassador_halar_regressions \
            tests.test_vieshow_booking_links \
            tests.test_vieshow_multiday
          node --check web/version-filter.js
          node --check web/app.js
          node tests/frontend_version_filter_test.js
          node tests/frontend_date_state_test.js
          node tests/frontend_time_filter_test.js
          node tests/frontend_empty_state_test.js
          node tests/frontend_showtime_booking_cta_test.js
          git diff --check

      - name: Browser format filter acceptance
        run: |
          python -m http.server 8765 --directory web >/tmp/format-filter-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python tests/browser_format_filter_acceptance.py

      - name: Live Venice multi-version acceptance
        run: |
          xvfb-run -a --server-args="-screen 0 1366x900x24" python - <<'PY'
          from pathlib import Path
          import sys

          from bs4 import BeautifulSoup

          sys.path.insert(0, str(Path("scripts").resolve()))
          import fetch_movie_showtimes as s

          aliases = ["蜘蛛人：重生日", "蜘蛛人 重生日"]
          dates = [
              "2026-09-25",
              "2026-09-26",
              "2026-09-27",
              "2026-09-28",
              "2026-09-29",
              "2026-09-30",
              "2026-10-01",
          ]

          listing = s.render_page_html(s.VENICE_URL.format(page=1), wait_ms=4000)
          options = s.venice_version_options(BeautifulSoup(listing, "html.parser"), aliases)
          titles = [title for title, _ in options]
          print({"detected_versions": titles})

          assert any("2D-Atmos" in title for title in titles), titles
          assert any("3D-Atmos" in title for title in titles), titles
          assert any("水影威尼斯" in title for title in titles), titles

          records = []
          for title, detail_url in options:
              detail = s.render_page_html(detail_url, wait_ms=2500)
              for show_date in dates:
                  records.extend(
                      s.parse_venice_detail_page(
                          detail,
                          location_id=23,
                          aliases=aliases,
                          version_title=title,
                          show_date=show_date,
                          source_url=detail_url,
                      )
                  )

          scheduled_formats = sorted({r.format for r in records if r.format})
          print({"scheduled_formats": scheduled_formats, "records": len(records)})
          assert records, "Expected at least one current Spider-Man Venice session"
          assert set(scheduled_formats).issubset(set(titles))
          assert all(r.format in titles for r in records)
          PY
