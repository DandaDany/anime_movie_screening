name: Format filter acceptance

on:
  push:
    branches:
      - research/showtime-format-audit
    paths:
      - web/app.js
      - web/index.html
      - web/styles.css
      - web/version-filter.js
      - scripts/fetch_movie_showtimes.py
      - tests/frontend_version_filter_test.js
      - tests/browser_format_filter_acceptance.py
      - tests/fixtures/format_filter_locations.geojson
      - tests/test_venice_format_versions.py
      - .github/workflows/format-filter-acceptance.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Unit and frontend regression tests
        run: |
          python -m unittest             tests.test_venice_format_versions             tests.test_ambassador_halar_regressions             tests.test_vieshow_booking_links             tests.test_vieshow_multiday
          node --check web/version-filter.js
          node --check web/app.js
          node tests/frontend_version_filter_test.js
          node tests/frontend_date_state_test.js
          node tests/frontend_time_filter_test.js
          node tests/frontend_empty_state_test.js
          node tests/frontend_showtime_booking_cta_test.js
          git diff --check

      - name: Browser format filter acceptance
        run: |
          python -m http.server 8765 --directory web >/tmp/format-filter-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python tests/browser_format_filter_acceptance.py

      - name: Live Venice multi-version acceptance
        run: |
          xvfb-run -a --server-args="-screen 0 1366x900x24" python - <<'PY'
          import sqlite3
          import tempfile
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("scripts").resolve()))
          import fetch_movie_showtimes as s
          from init_db import init_db

          with tempfile.TemporaryDirectory() as tmp:
              db = Path(tmp) / "venice.sqlite"
              init_db(db)
              with sqlite3.connect(db) as conn:
                  conn.row_factory = sqlite3.Row
                  chain_id = conn.execute(
                      "INSERT INTO cinema_chains (chain_name, official_url) VALUES (?, ?)",
                      ("威尼斯影城", "https://www.venice-cinemas.com.tw/"),
                  ).lastrowid
                  conn.execute(
                      """INSERT INTO cinema_locations
                         (chain_id, location_name, city, latitude, longitude, active)
                         VALUES (?, ?, ?, ?, ?, 1)""",
                      (chain_id, "威尼斯影城", "桃園市", 24.95, 121.22),
                  )
                  conn.commit()

                  all_records = []
                  for show_date in (
                      "2026-09-25",
                      "2026-09-26",
                      "2026-09-27",
                      "2026-09-28",
                      "2026-09-29",
                      "2026-09-30",
                      "2026-10-01",
                  ):
                      all_records.extend(
                          s.fetch_venice(conn, ["蜘蛛人：重生日", "蜘蛛人 重生日"], show_date)
                      )

              formats = sorted({r.format for r in all_records if r.format})
              print({"formats": formats, "records": len(all_records)})
              assert any("2D-Atmos" in value for value in formats), formats
              assert any("3D-Atmos" in value for value in formats), formats
              assert any("水影威尼斯" in value for value in formats), formats
          PY
