name: Japanese animation poster candidate probe TEMP
on:
  push:
    branches: [fix/japanese-only-film-catalog-20261026]
    paths: ['.github/workflows/poster-jp-candidate-probe-temp.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pillow
      - run: |
          python - <<'PY'
          from io import BytesIO
          import requests
          from PIL import Image
          urls=[
          ('hanabi-official-sp','https://kimi-hana-movie.com/img/kv_main-sp2.jpg'),
          ('hanabi-official-c01','https://kimi-hana-movie.com/img/kv_c01.jpg'),
          ('hanabi-official-c02','https://kimi-hana-movie.com/img/kv_c02.jpg'),
          ('hanabi-official-c03','https://kimi-hana-movie.com/img/kv_c03.jpg'),
          ('hanabi-cinema-original','https://img.cinematoday.jp/a/T0032152/_v_1784684990/posters/1.jpg'),
          ('hanabi-cinema-size1200','https://img.cinematoday.jp/a/T0032152/_size_1200x/_v_1784684990/posters/1.jpg'),
          ('hanabi-tmdb','https://image.tmdb.org/t/p/original/fP2BlnOo7D8VZrKaldgQsji6QEV.jpg'),
          ('rakuen1-moviego','https://obs.line-scdn.net/0h31gbMKi6bB5aG3Cb_SETSQhNb3Fpd38dPi09KiQaMlACWykjZQZ5EH17enw8VHAzOQErKCBrMVUoSyMjFBYjGRpsd0UeSG43ZQJrEzR4eUU8W3cYA3xl'),
          ('rakuen2-moviego','https://obs.line-scdn.net/0hN32b_KDEERwPGw2ZqD1uS11NEnM8dwIfay1AKHEaTX5pVBEZRXgVKExSEEd5eR0xbAFWKnVrTFd9S14hQRZeG09sCkdLSBM1MQYYKmF4BEdpWwoaVnwY'),
          ]
          for name,url in urls:
           try:
            r=requests.get(url,timeout=14,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.google.com/'});r.raise_for_status()
            img=Image.open(BytesIO(r.content));print('DIRECT',name,img.size,img.format,len(r.content),url,flush=True)
           except Exception as e:print('DIRECT_ERROR',name,str(e)[:180],flush=True)
          PY
