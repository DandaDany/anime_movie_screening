name: VIESHOW seat map spike

on:
  push:
    branches:
      - research/vieshow-seat-map
    paths:
      - scripts/spike_vieshow_seat_map.py
      - .github/workflows/vieshow-seat-map-spike.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run read-only seat-map spike
        run: |
          xvfb-run -a --server-args="-screen 0 1366x900x24"             python scripts/spike_vieshow_seat_map.py
