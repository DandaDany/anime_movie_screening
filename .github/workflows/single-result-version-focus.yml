name: Single-result version focus acceptance

on:
  push:
    branches:
      - test/single-result-filter-focus
    paths:
      - web/app.js
      - web/index.html
      - web/styles.css
      - web/version-filter.js
      - tests/browser_format_filter_acceptance.py
      - tests/fixtures/format_filter_locations.geojson
      - .github/workflows/single-result-version-focus.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run regressions
        run: |
          python -m unittest             tests.test_venice_format_versions             tests.test_ambassador_halar_regressions             tests.test_vieshow_booking_links             tests.test_vieshow_multiday             tests.test_verify_vieshow_direct_booking
          node --check web/version-filter.js
          node --check web/app.js
          node tests/frontend_version_filter_test.js
          node tests/frontend_date_state_test.js
          node tests/frontend_time_filter_test.js
          node tests/frontend_empty_state_test.js
          node tests/frontend_showtime_booking_cta_test.js
          git diff --check

      - name: Browser single-result focus acceptance
        run: |
          python -m http.server 8765 --directory web >/tmp/single-result-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python tests/browser_format_filter_acceptance.py
