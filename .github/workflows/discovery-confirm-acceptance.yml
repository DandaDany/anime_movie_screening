name: Discovery confirmation acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'fix/discovery-confirm-other-dates'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Static checks
        run: |
          node --check web/discovery.js
          python -m compileall -q tests/browser_movie_discovery_acceptance.py

      - name: Start local web server
        run: |
          cd web
          python -m http.server 8765 --bind 127.0.0.1 > ../discovery-http.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Movie discovery browser acceptance
        run: python tests/browser_movie_discovery_acceptance.py
