name: Rename map title for PR41

on:
  push:
    branches:
      - fix/new-cinema-logos-madou-fallback-2026-09-14
    paths:
      - .github/workflows/rename-map-title-pr41.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/new-cinema-logos-madou-fallback-2026-09-14
      - name: Rename frontend title
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/index.html')
          text = path.read_text(encoding='utf-8')
          old = '全台動畫電影上映地圖'
          new = '日本動畫電影上映地圖'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 title occurrences, found {count}')
          text = text.replace(old, new)
          if old in text or text.count(new) < 2:
              raise SystemExit('title replacement verification failed')
          path.write_text(text, encoding='utf-8')
          print(f'RENAME_PASS occurrences={count}')
          PY
      - name: Commit title change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html
          git commit -m "Rename map to 日本動畫電影上映地圖"
          git push
