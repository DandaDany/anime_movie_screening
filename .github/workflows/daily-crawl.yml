name: Daily crawl and publish map

# GitHub-native full crawl. The full crawl runs at 06:00 Asia/Taipei.
# A separate 07:00 ChatGPT web-research pass may add verified supplemental records.
# Before rebuilding GeoJSON, preserve existing supplemental records; after the full export, restore
# valid current/future supplemental features and refresh deterministic public-web fallback sources.

on:
  schedule:
    - cron: "0 22 * * *" # 06:00 Asia/Taipei
  workflow_dispatch:
    inputs:
      date:
        description: "場次日期 YYYY-MM-DD（留空＝台灣時區的今天）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # All workflows that commit map data share one writer lock. This prevents
  # the 07:00 supplement from pushing locations.geojson while the full crawl
  # is still building its own update.
  group: map-data-writer
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Taipei
      MUSE_API_BASE_URL: ${{ secrets.MUSE_API_BASE_URL }}
      MUSE_API_TOKEN: ${{ secrets.MUSE_API_TOKEN }}
      MUSE_WORKER_NAME: github-actions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium and system deps
        run: python -m playwright install --with-deps chromium

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Build cinema master DB
        run: python scripts/pull_cinema_master.py --require-codes

      - name: Overlay version-controlled cinema data and verify Shin Kong
        run: |
          python scripts/import_cinema_sources.py data/input/cinema_codes.csv --overlay-existing --chain "新光影城" --require-existing
          python scripts/verify_cinema_codes.py --csv data/input/cinema_codes.csv --chain "新光影城"
          python scripts/import_cinema_sources.py data/input/manual_location_urls.csv --overlay-existing --chain "秀泰影城" --require-existing

      - name: Refresh scraped-chain location codes
        run: |
          if curl -L -o /dev/null -sS --connect-timeout 15 --max-time 90 \
            -w 'SKCINEMAS curl http=%{http_code} ip=%{remote_ip} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\n' \
            'https://www.skcinemas.com/films?c=1001'; then
            SKCINEMAS_OFFICIAL_REACHABLE=true
            echo 'SKCINEMAS_OFFICIAL_REACHABLE=true' >> "$GITHUB_ENV"
          else
            SKCINEMAS_OFFICIAL_REACHABLE=false
            echo 'SKCINEMAS_OFFICIAL_REACHABLE=false' >> "$GITHUB_ENV"
            echo '::warning::SKCINEMAS official site is unreachable; the daily crawl will use the @movies fallback.'
          fi
          if [ "$SKCINEMAS_OFFICIAL_REACHABLE" = "false" ]; then
            echo 'SKCINEMAS official site unavailable; retaining verified last-known-good codes.'
          elif ! (xvfb-run -a --server-args="-screen 0 1366x900x24" python scripts/fetch_skcinemas_locations.py --headed || \
              xvfb-run -a --server-args="-screen 0 1366x900x24" python scripts/fetch_skcinemas_locations.py --headed); then
            echo "::warning::新光即時據點刷新失敗；保留已驗證代碼，並由場次來源回報最終狀態。"
          fi
          python scripts/fetch_in89_locations.py || true
          python scripts/fetch_ambassador_locations.py || true
          python scripts/fetch_showtimes_locations.py || true
          python scripts/fetch_misc_locations.py || true

      - name: Persist refreshed cinema codes
        run: python scripts/push_cinema_codes.py

      - name: Snapshot existing supplemental records
        run: cp web/data/locations.geojson /tmp/pre-crawl-locations.geojson

      - name: Run daily crawl (headful via Xvfb)
        env:
          SKCINEMAS_HEADLESS: "false"
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          xvfb-run -a --server-args="-screen 0 1366x900x24" python scripts/daily_update.py --no-git $DATE_ARG

      - name: Restore and refresh supplemental cinemas
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python -m unittest \
            tests.test_supplemental_web_update \
            tests.test_supplemental_finalize \
            tests.test_broadway_canonical_merge \
            tests.test_cinema_master_integrity \
            tests.test_madou_atmovies_fallback \
            tests.test_new_cinema_metadata
          python scripts/preserve_supplemental_geojson.py --from /tmp/pre-crawl-locations.geojson $DATE_ARG
          python scripts/supplemental_web_update.py $DATE_ARG
          python scripts/madou_atmovies_fallback.py $DATE_ARG
          python scripts/finalize_supplemental_geojson.py $DATE_ARG

      - name: Verify VIESHOW direct booking links
        run: python scripts/verify_vieshow_direct_booking.py

      - name: Commit and push updated map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/locations.geojson web/data/movie_discovery.json 電影清單.txt
          if [ -f data/control/cinema_master.json ]; then
            git add data/control/cinema_master.json
          fi
          if git diff --cached --quiet; then
            echo "地圖資料與 control state 無變動，無須發佈。"
          else
            git commit -m "Update map data (scheduled crawl)"
            # main may have advanced while the long crawl was running (for
            # example the 07:00 research agent can commit its small control
            # file). Rebase the generated data commit onto the latest main
            # before publishing instead of failing with non-fast-forward.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

  deploy-pages:
    needs: crawl
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build browser runtime config
        env:
          CARTO_BASEMAP_KEY: ${{ secrets.CARTO_BASEMAP_KEY }}
        run: python3 scripts/build_web_runtime_config.py --require-carto-key

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
