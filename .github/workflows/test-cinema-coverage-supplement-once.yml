name: Cinema coverage + supplement integration test once

on:
  push:
    branches:
      - feat/cinema-coverage-0600-supplement-2026-09-13
    paths:
      - .github/workflows/test-cinema-coverage-supplement-once.yml

permissions:
  contents: write

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/cinema-coverage-0600-supplement-2026-09-13

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply and validate cinema coverage migration
        run: |
          python scripts/apply_cinema_coverage_20260913.py
          python scripts/pull_cinema_master.py --require-codes
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/control/cinema_master.json').read_text(encoding='utf-8'))
          chains={c['id']:c for c in p['chains']}
          locs={l['id']:l for l in p['locations']}
          assert len(p['chains']) == 50, len(p['chains'])
          assert len(p['locations']) == 114, len(p['locations'])
          assert locs[74]['chain_id'] == 33 and chains[33]['chain_name'] == '真善美劇院'
          assert locs[96]['active'] is False
          assert locs[97]['active'] is False
          assert locs[104]['location_name'] == '麻豆戲院'
          assert locs[112]['location_name'] == '高雄市電影館'
          print('MASTER_QC_PASS chains=50 locations=114 active=', sum(1 for x in p['locations'] if x['active']))
          PY

      - name: Run supplemental regression tests
        run: python -m unittest tests.test_supplemental_web_update

      - name: Run real public-web supplement
        run: |
          python scripts/supplemental_web_update.py --date 2026-09-13
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('web/data/locations.geojson').read_text(encoding='utf-8'))
          assert p['show_date'] == '2026-09-13'
          assert p.get('supplemental_updated_at')
          print('GEOJSON_QC_PASS movies=', len(p.get('movies', [])), 'dates=', len(p.get('available_dates', [])))
          hits=[]
          for title, by_date in p.get('movie_features_by_date', {}).items():
              for day, features in by_date.items():
                  for feature in features:
                      props=feature.get('properties', {})
                      if props.get('supplemental_web_source') and props.get('showtime_count', 0) > 0:
                          hits.append((title, day, props.get('location_name'), props.get('start_times')))
          print('SUPPLEMENTAL_REAL_HITS=', len(hits))
          for row in hits[:30]: print('SUPPLEMENTAL_HIT', *row, sep=' | ')
          PY

      - name: Commit generated master and test GeoJSON to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/control/cinema_master.json web/data/locations.geojson
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Materialize verified cinema coverage and supplemental test data"
            git push
          fi
