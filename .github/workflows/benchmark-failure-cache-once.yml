name: Failure-cache benchmark once

on:
  push:
    branches:
      - perf/failure-cache-benchmark-2026-09-13
    paths:
      - .github/workflows/benchmark-failure-cache-once.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
      MUSE_API_BASE_URL: ${{ secrets.MUSE_API_BASE_URL }}
      MUSE_API_TOKEN: ${{ secrets.MUSE_API_TOKEN }}
      MUSE_WORKER_NAME: github-actions-failure-cache-benchmark
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4
        with:
          ref: perf/failure-cache-benchmark-2026-09-13

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify crawler regressions
        run: |
          python -m unittest \
            tests.test_batch_showtime_runner \
            tests.test_daily_update_multiday \
            tests.test_misc_location_resilience \
            tests.test_source_failure_preservation

      - name: Install Playwright Chromium and system deps
        run: python -m playwright install --with-deps chromium

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Build cinema master DB
        run: python scripts/pull_cinema_master.py --require-codes

      - name: Overlay cinema data and verify Shin Kong
        run: |
          python scripts/import_cinema_sources.py data/input/cinema_codes.csv --overlay-existing --chain "新光影城" --require-existing
          python scripts/verify_cinema_codes.py --csv data/input/cinema_codes.csv --chain "新光影城"
          python scripts/import_cinema_sources.py data/input/manual_location_urls.csv --overlay-existing --chain "秀泰影城" --require-existing

      - name: Refresh scraped-chain location codes
        run: |
          if curl -L -o /dev/null -sS --connect-timeout 15 --max-time 90 'https://www.skcinemas.com/films?c=1001'; then
            echo 'SKCINEMAS_OFFICIAL_REACHABLE=true' >> "$GITHUB_ENV"
            SKCINEMAS_OFFICIAL_REACHABLE=true
          else
            echo 'SKCINEMAS_OFFICIAL_REACHABLE=false' >> "$GITHUB_ENV"
            SKCINEMAS_OFFICIAL_REACHABLE=false
            echo '::warning::SKCINEMAS official site is unreachable; using @movies fallback.'
          fi
          if [ "$SKCINEMAS_OFFICIAL_REACHABLE" = "true" ]; then
            xvfb-run -a --server-args="-screen 0 1366x900x24" python scripts/fetch_skcinemas_locations.py --headed || true
          fi
          python scripts/fetch_in89_locations.py || true
          python scripts/fetch_ambassador_locations.py || true
          python scripts/fetch_showtimes_locations.py || true
          python scripts/fetch_misc_locations.py || true

      - name: Persist refreshed cinema codes
        run: python scripts/push_cinema_codes.py

      - name: Benchmark shared-cache crawl with ACE/PTC failure cache
        env:
          SKCINEMAS_HEADLESS: "false"
        run: |
          time xvfb-run -a --server-args="-screen 0 1366x900x24" \
            python scripts/daily_update.py --no-git --date 2026-09-13
