name: Upcoming posters and notice acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'fix/upcoming-posters-and-message'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Taipei

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Static and data checks
        run: |
          node --check web/discovery.js
          python -m compileall -q tests/browser_movie_discovery_acceptance.py tests/test_movie_discovery_data.py
          python -m unittest tests.test_movie_discovery_data
          python scripts/build_movie_discovery_data.py --require-posters
          git diff --exit-code -- web/data/movie_discovery.json
      - name: Start local server
        run: |
          cd web
          python -m http.server 8765 --bind 127.0.0.1 > ../upcoming-poster-http.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Movie discovery browser acceptance
        run: python tests/browser_movie_discovery_acceptance.py
