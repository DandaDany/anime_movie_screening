name: Deploy map to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build browser runtime config
        env:
          CARTO_BASEMAP_KEY: ${{ secrets.CARTO_BASEMAP_KEY }}
        run: python3 scripts/build_web_runtime_config.py --require-carto-key

      - name: Prepare transparent brand icons
        run: |
          python3 -m pip install "Pillow>=10,<13"
          python3 scripts/prepare_brand_assets.py

      - name: Build crawlable movie pages and sitemap
        run: python3 scripts/build_seo_pages.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        continue-on-error: true
        run: python3 scripts/submit_indexnow.py --sitemap web/sitemap.xml
