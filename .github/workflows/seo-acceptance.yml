name: SEO acceptance

on:
  pull_request:
    paths:
      - "scripts/build_seo_pages.py"
      - "scripts/submit_indexnow.py"
      - "tests/test_build_seo_pages.py"
      - "tests/test_submit_indexnow.py"
      - "web/836c466d1aa7e23aa7c824b5c66d8581.txt"
      - "tests/browser_seo_movie_page_acceptance.py"
      - "tests/browser_movie_discovery_acceptance.py"
      - "web/index.html"
      - "web/assets/brand/**"
      - "web/about.html"
      - "web/404.html"
      - "web/app.js"
      - "web/movie-detail-list.js"
      - "web/movie-detail-list.css"
      - "web/discovery.js"
      - "web/discovery.css"
      - "web/seo.css"
      - "web/seo-movie.js"
      - ".github/workflows/pages.yml"
      - ".github/workflows/daily-crawl.yml"
      - ".github/workflows/supplemental-0600.yml"
      - ".github/workflows/seo-acceptance.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run SEO unit and syntax tests
        run: |
          python -m unittest tests.test_build_seo_pages tests.test_submit_indexnow -v
          python -m py_compile scripts/build_seo_pages.py scripts/submit_indexnow.py tests/browser_seo_movie_page_acceptance.py
          node --check web/seo-movie.js
          node --check web/movie-detail-list.js
          node --check web/version-filter.js
          node --check web/app.js
          node --check web/discovery.js
          grep -q "gtag('config', 'G-9C8B8ZCL6M');" web/index.html
          node tests/frontend_version_filter_test.js
      - name: Build SEO artifact from repository data
        run: python scripts/build_seo_pages.py
      - name: Validate generated outputs
        run: |
          test -f web/sitemap.xml
          test -f web/robots.txt
          test -f web/about.html
          test -f web/404.html
          test -f web/assets/brand/logo-512.png
          test -f web/assets/brand/og-home.jpg
          grep -q 'assets/brand/og-home.jpg' web/index.html
          grep -q 'assets/brand/logo-512.png' web/index.html
          grep -q 'rel="canonical" href="https://dandadany.github.io/anime_movie_screening/about.html"' web/about.html
          grep -q 'name="robots" content="noindex, follow"' web/404.html
          grep -q 'about.html' web/sitemap.xml
          ! grep -q '404.html' web/sitemap.xml
          ls web/movie-*.html >/dev/null
          grep -q 'rel="canonical"' web/movie-*.html
          grep -q 'movie-' web/sitemap.xml
          grep -q 'class="app-shell movie-detail-shell"' web/movie-*.html
          grep -q 'id="cinemaListPanel"' web/movie-*.html
          grep -q 'id="map"' web/movie-*.html
          grep -q 'styles.css?v=20261007a' web/movie-*.html
          grep -q 'name="robots" content="index, follow, max-image-preview:large"' web/index.html
          grep -q 'name="robots" content="index, follow, max-image-preview:large"' web/movie-*.html
          grep -q 'User-agent: OAI-SearchBot' web/robots.txt
          grep -q 'User-agent: PerplexityBot' web/robots.txt
          grep -q 'User-agent: Bingbot' web/robots.txt
          grep -q '"@type": "ScreeningEvent"' web/movie-*.html
          grep -q '"@type": "MovieTheater"' web/movie-*.html
          grep -q '"dateModified":' web/movie-*.html
          test "$(cat web/836c466d1aa7e23aa7c824b5c66d8581.txt)" = "836c466d1aa7e23aa7c824b5c66d8581"
          python scripts/submit_indexnow.py --sitemap web/sitemap.xml --dry-run >/tmp/indexnow-payload.json
          grep -q '"host": "dandadany.github.io"' /tmp/indexnow-payload.json
      - name: Browser acceptance for generated movie pages
        run: |
          python -m http.server 8765 --directory web >/tmp/seo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python tests/browser_seo_movie_page_acceptance.py
          python tests/browser_format_filter_acceptance.py
