name: Hotfix ShowTimes booking links once

on:
  push:
    branches:
      - fix/showtimes-link-data-hotfix
    paths:
      - .github/workflows/showtimes-link-hotfix-once.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/showtimes-link-data-hotfix

      - name: Rewrite current ShowTimes URLs from official bootstrap
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          from pathlib import Path

          def normalize(value):
              if not value:
                  return ""
              table = str.maketrans("０１２３４５６７８９", "0123456789")
              value = str(value).translate(table).lower()
              return re.sub(r"[\s　:：,，.。、/／()（）\[\]【】\-–—_．・‧|｜'\"“”‘’!！?？~～]+", "", value)

          req = urllib.request.Request(
              "https://capi.showtimes.com.tw/4/app/bootstrap",
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json,text/plain,*/*",
                  "Origin": "https://www.showtimes.com.tw",
                  "Referer": "https://www.showtimes.com.tw/",
              },
          )
          with urllib.request.urlopen(req, timeout=45) as response:
              payload = json.load(response)["payload"]

          tracked = json.load(open("data/control/tracked_movies.json", encoding="utf-8"))
          aliases_by_title = {}
          for movie in tracked.get("movies", []):
              aliases_by_title[movie["title"]] = [movie["title"], *(movie.get("aliases") or [])]

          programs = []
          for p in payload.get("programs", []):
              pid = int(p["id"])
              names = [str(p.get("name") or ""), str(p.get("nameAlternative") or "")]
              programs.append((pid, names, [normalize(x) for x in names], normalize(" ".join(names))))

          path = Path("web/data/locations.geojson")
          data = json.load(path.open(encoding="utf-8"))

          mapped = {}
          changed = 0
          showtimes_seen = 0

          for title, by_date in (data.get("movie_features_by_date") or {}).items():
              has_showtimes = any(
                  "秀泰" in str((feature.get("properties") or {}).get("chain_name") or "")
                  for features in (by_date or {}).values()
                  for feature in (features or [])
              )
              if not has_showtimes:
                  continue

              aliases = aliases_by_title.get(title, [title])
              alias_norms = [normalize(x) for x in aliases if normalize(x)]

              exact = {
                  pid
                  for pid, names, name_norms, combined in programs
                  if any(alias in name_norms for alias in alias_norms)
              }
              candidates = exact
              if not candidates:
                  candidates = {
                      pid
                      for pid, names, name_norms, combined in programs
                      if any(alias in combined for alias in alias_norms)
                  }
              if len(candidates) != 1:
                  matching = [
                      {"id": pid, "names": names}
                      for pid, names, name_norms, combined in programs
                      if pid in candidates
                  ]
                  raise SystemExit(
                      f"ShowTimes program mapping must be unique: {title!r} aliases={aliases!r} candidates={matching!r}"
                  )
              program_id = next(iter(candidates))
              mapped[title] = program_id

              for show_date, features in (by_date or {}).items():
                  for feature in features or []:
                      props = feature.get("properties") or {}
                      if "秀泰" not in str(props.get("chain_name") or ""):
                          continue
                      for st in props.get("showtimes") or []:
                          old = str(st.get("booking_url") or "")
                          showtimes_seen += 1
                          cid = None
                          if "/ticketing?cid=" in old:
                              cid = urllib.parse.parse_qs(urllib.parse.urlparse(old).query).get("cid", [None])[0]
                          elif "/ticketing/selectEvents/" in old:
                              m = re.search(r"/ticketing/selectEvents/(\d+)/(\d+)", old)
                              if m:
                                  cid = m.group(1)
                          if not cid:
                              raise SystemExit(f"Cannot derive ShowTimes cinema id from {old!r}")
                          new = f"https://www.showtimes.com.tw/ticketing/selectEvents/{cid}/{program_id}?date={show_date}"
                          if old != new:
                              st["booking_url"] = new
                              changed += 1

          old_urls = []
          new_urls = []
          for by_date in (data.get("movie_features_by_date") or {}).values():
              for features in (by_date or {}).values():
                  for feature in features or []:
                      props = feature.get("properties") or {}
                      if "秀泰" not in str(props.get("chain_name") or ""):
                          continue
                      for st in props.get("showtimes") or []:
                          url = str(st.get("booking_url") or "")
                          if "/ticketing?cid=" in url:
                              old_urls.append(url)
                          if "/ticketing/selectEvents/" in url:
                              new_urls.append(url)

          print("Mapped ShowTimes programs:", json.dumps(mapped, ensure_ascii=False, sort_keys=True))
          print(f"ShowTimes showtimes={showtimes_seen} changed={changed} old_links={len(old_urls)} new_links={len(new_urls)}")
          if not mapped:
              raise SystemExit("No ShowTimes movies were mapped")
          if old_urls:
              raise SystemExit(f"Old ShowTimes links remain: {old_urls[:5]!r}")
          if not new_urls:
              raise SystemExit("No new ShowTimes selectEvents links produced")
          if not all(re.search(r"/ticketing/selectEvents/\d+/\d+\?date=\d{4}-\d{2}-\d{2}$", u) for u in new_urls):
              raise SystemExit("Malformed ShowTimes selectEvents URL generated")

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit corrected public map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/locations.geojson
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 1
          fi
          git commit -m "Refresh ShowTimes booking links in public data"
          git push origin HEAD:fix/showtimes-link-data-hotfix
