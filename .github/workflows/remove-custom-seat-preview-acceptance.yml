name: Remove custom seat preview acceptance

on:
  push:
    branches:
      - fix/remove-custom-seat-preview
    paths:
      - web/app.js
      - tests/frontend_showtime_booking_cta_test.js
      - .github/workflows/daily-crawl.yml
      - .github/workflows/remove-custom-seat-preview-acceptance.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Frontend and workflow regression
        run: |
          node --check web/app.js
          node tests/frontend_showtime_booking_cta_test.js
          node tests/frontend_version_filter_test.js
          node tests/frontend_date_state_test.js
          node tests/frontend_time_filter_test.js
          python -m unittest tests.test_verify_vieshow_direct_booking
          if grep -R "seat-preview" web scripts tests .github/workflows             --exclude=remove-custom-seat-preview-acceptance.yml; then
            echo "Custom seat preview reference still exists"
            exit 1
          fi
          test ! -e web/seat-preview.html
          test ! -e web/seat-preview.js
          test ! -e web/seat-preview.css
          test ! -e web/data/vieshow_seat_previews.json
          test ! -e scripts/fetch_vieshow_seat_previews.py
          git diff --check
