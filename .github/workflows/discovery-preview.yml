name: Discovery UI preview

on:
  push:
    branches:
      - feature/movie-discovery-home-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARTO_BASEMAP_KEY: ${{ secrets.CARTO_BASEMAP_KEY }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Build browser runtime config
        run: python3 scripts/build_web_runtime_config.py

      - name: Install Playwright Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8765 --directory web > /tmp/discovery-preview-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/discovery-preview-server.log
          exit 1

      - name: Capture desktop preview
        run: |
          npx -y playwright@1.55.0 screenshot \
            --browser chromium \
            --viewport-size "1440,1100" \
            --wait-for-timeout 7000 \
            --full-page \
            "http://127.0.0.1:8765/?discoveryPreviewLayout=1" \
            discovery-home-v1.png

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: discovery-home-v1
          path: discovery-home-v1.png
          if-no-files-found: error
          retention-days: 3
