name: Final Century seat preview and digital fallback acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'feat/century-seat-preview-digital-fallback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Static and frontend tests
        run: |
          node --check web/app.js
          node --check web/version-filter.js
          node tests/frontend_version_filter_test.js
          node tests/frontend_showtime_booking_cta_test.js
          python -m compileall -q tests/browser_format_filter_acceptance.py tests/browser_showtimes_booking_acceptance.py
      - name: Start local server
        run: |
          cd web
          python -m http.server 8765 --bind 127.0.0.1 > ../acceptance-http.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Format filter browser acceptance
        run: python tests/browser_format_filter_acceptance.py
      - name: Booking and seat preview browser acceptance
        run: python tests/browser_showtimes_booking_acceptance.py
