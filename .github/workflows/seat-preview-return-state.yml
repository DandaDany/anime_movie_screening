name: Seat preview return-state acceptance

on:
  push:
    branches:
      - fix/seat-preview-return-state
    paths:
      - web/app.js
      - web/discovery.js
      - web/index.html
      - web/seat-preview.html
      - web/seat-preview.js
      - web/seat-preview.css
      - tests/browser_seat_preview_return_state.py
      - tests/frontend_showtime_booking_cta_test.js
      - tests/fixtures/seat_return_locations.geojson
      - .github/workflows/seat-preview-return-state.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Regression tests
        run: |
          node --check web/app.js
          node --check web/discovery.js
          node --check web/seat-preview.js
          node tests/frontend_showtime_booking_cta_test.js
          node tests/frontend_version_filter_test.js
          node tests/frontend_date_state_test.js
          node tests/frontend_time_filter_test.js
          python -m unittest             tests.test_vieshow_seat_previews             tests.test_verify_vieshow_direct_booking
          git diff --check

      - name: Browser round-trip acceptance
        run: |
          python -m http.server 8765 --directory web >/tmp/seat-return-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python tests/browser_seat_preview_return_state.py
