name: High-res poster probe

on:
  push:
    branches:
      - fix/highres-correct-posters-20260928
    paths:
      - "scripts/probe_highres_posters.py"
      - ".github/workflows/highres-poster-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4 pillow
      - run: python scripts/probe_highres_posters.py
