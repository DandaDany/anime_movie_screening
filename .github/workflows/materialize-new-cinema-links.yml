name: Materialize new cinema official links

on:
  push:
    branches:
      - fix/new-cinema-logos-madou-fallback-2026-09-14
    paths:
      - .github/workflows/materialize-new-cinema-links.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/new-cinema-logos-madou-fallback-2026-09-14
      - name: Patch canonical cinema master
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/control/cinema_master.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          chains = {int(item['id']): item for item in payload['chains']}
          locations = {int(item['id']): item for item in payload['locations']}

          chains[37]['official_url'] = 'https://www.facebook.com/YuanlinCinema'
          chains[37]['notes'] = 'Local cinema; official Facebook page plus @movies as reproducible supplemental source.'
          chains[40]['official_url'] = 'https://www.facebook.com/196018270491462'
          chains[40]['notes'] = 'Tainan Xibei first-run cinema; official Facebook/Instagram schedules are social-first. @movies is the deterministic supplement.'

          locations[101]['location_url'] = 'https://www.facebook.com/YuanlinCinema'
          locations[101]['notes'] = 'Official Facebook page is the venue-owned public entry; @movies remains the automated fallback.'
          locations[104]['location_url'] = 'https://www.facebook.com/196018270491462'
          locations[104]['notes'] = 'Schedules announced primarily on official Facebook/Instagram; redundant @movies mirrors are retained as deterministic fallback.'

          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit canonical metadata update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/control/cinema_master.json
          if git diff --cached --quiet; then
            echo "No cinema metadata changes."
          else
            git commit -m "Add official social links for Yuanlin and Madou"
            git push
          fi
