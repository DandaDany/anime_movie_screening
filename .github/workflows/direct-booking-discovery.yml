name: Direct booking discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'feat/multi-cinema-direct-booking-seats'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Probe current official booking flows
        run: |
          xvfb-run -a --server-args="-screen 0 1366x900x24" python scripts/probe_direct_booking.py
