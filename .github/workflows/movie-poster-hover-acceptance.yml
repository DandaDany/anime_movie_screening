name: Movie poster hover acceptance

on:
  push:
    branches:
      - feature/movie-poster-hover-lift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          mkdir -p artifacts
          python3 -m http.server 8765 --directory web > artifacts/http-server.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Verify hover lift
        run: |
          cat > /tmp/hover-test.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('http://127.0.0.1:8765/', {waitUntil:'networkidle'});
            const card = page.locator('#nowShowingGrid .movie-card').first();
            await card.waitFor({state:'visible'});
            const before = await card.evaluate(el => getComputedStyle(el).transform);
            await card.hover();
            await page.waitForTimeout(260);
            const after = await card.evaluate(el => getComputedStyle(el).transform);
            const shadow = await card.locator('.movie-card__poster').evaluate(el => getComputedStyle(el).boxShadow);
            if (before === after || after === 'none') throw new Error(`hover transform did not change: ${before} -> ${after}`);
            if (!shadow || shadow === 'none') throw new Error('hover shadow missing');
            await page.screenshot({path:'artifacts/movie-poster-hover.png', fullPage:true});
            await browser.close();
          })();
          EOF
          NODE_PATH="$(pwd)/node_modules" node /tmp/hover-test.js

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-poster-hover-${{ github.run_id }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 3
