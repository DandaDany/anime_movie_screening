name: VIESHOW session direct URL spike

on:
  push:
    branches:
      - research/vieshow-session-direct-url
    paths:
      - scripts/spike_vieshow_session_direct_url.py
      - scripts/fetch_movie_showtimes.py
      - web/app.js
      - web/styles.css
      - tests/test_vieshow_booking_links.py
      - tests/test_vieshow_multiday.py
      - .github/workflows/vieshow-session-spike.yml

permissions:
  contents: read

jobs:
  live-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout spike branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run VIESHOW regression tests
        run: |
          python -m unittest \
            tests.test_vieshow_booking_links \
            tests.test_vieshow_multiday \
            tests.test_batch_showtime_runner
          node --check web/app.js
          node tests/frontend_date_state_test.js
          node tests/frontend_time_filter_test.js
          node tests/frontend_empty_state_test.js

      - name: Run live VIESHOW five-cinema acceptance
        run: |
          xvfb-run -a --server-args="-screen 0 1366x900x24" \
            python scripts/spike_vieshow_session_direct_url.py
