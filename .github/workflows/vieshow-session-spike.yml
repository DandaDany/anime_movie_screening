name: VIESHOW session direct URL spike

on:
  push:
    branches:
      - research/vieshow-session-direct-url
    paths:
      - scripts/spike_vieshow_session_direct_url.py
      - .github/workflows/vieshow-session-spike.yml

permissions:
  contents: read

jobs:
  live-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout spike branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run live VIESHOW session URL spike
        run: |
          xvfb-run -a --server-args="-screen 0 1366x900x24" \
            python scripts/spike_vieshow_session_direct_url.py
