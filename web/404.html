<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/brand/logo-512.png" />
  <link rel="apple-touch-icon" href="assets/brand/logo-512.png" />
  <title>找不到頁面｜電影場次</title>
  <meta name="description" content="找不到這個電影場次頁面。" />
  <meta name="robots" content="noindex, follow" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 70% 20%, rgba(245,100,30,.12), transparent 30%),
        #0b0c10;
      color: rgba(255,255,255,.92);
      font-family: "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    }
    main {
      width: min(560px, calc(100% - 36px));
      text-align: center;
      padding: 48px 0;
    }
    .code {
      margin: 0 0 8px;
      color: rgba(255,255,255,.34);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
    }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 7vw, 42px); }
    p { margin: 0 auto 28px; color: rgba(255,255,255,.58); font-size: 14px; line-height: 1.8; }
    a {
      display: inline-block;
      border-radius: 999px;
      background: #f5641e;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      padding: 11px 18px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>找不到這個場次頁面</h1>
    <p>這個連結可能已經不存在或網址有誤。回到首頁查看目前正在上映與即將上映的動畫電影。</p>
    <a href="./">回到電影場次</a>
  </main>
</body>
</html>
