<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>日本動畫電影上映地圖</title>
    <meta name="description" content="快速找到想看的動畫電影" />
    <link rel="canonical" href="https://dandadany.github.io/anime_movie_screening/" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:site_name" content="日本動畫電影上映地圖" />
    <meta property="og:title" content="日本動畫電影上映地圖" />
    <meta property="og:description" content="快速找到想看的動畫電影" />
    <meta property="og:url" content="https://dandadany.github.io/anime_movie_screening/" />
    <meta property="og:image" content="https://dandadany.github.io/anime_movie_screening/assets/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="315" />
    <meta property="og:image:alt" content="日本動畫電影上映地圖－快速找到想看的動畫電影" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="日本動畫電影上映地圖" />
    <meta name="twitter:description" content="快速找到想看的動畫電影" />
    <meta name="twitter:image" content="https://dandadany.github.io/anime_movie_screening/assets/og-image.png" />
    <meta name="twitter:image:alt" content="日本動畫電影上映地圖－快速找到想看的動畫電影" />

    <style>
      .brand-logo {
        display: block;
        width: min(100%, 310px);
        height: auto;
      }
    </style>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css?v=20260813a" />
    <link rel="stylesheet" href="empty-state.css?v=20260820a" />
    <link rel="stylesheet" href="discovery.css?v=20260925d" />

    <!-- Google Analytics 4（GA4）— 免費網站流量分析。
         啟用步驟：到 https://analytics.google.com 建立 GA4 資源，取得「評估 ID」
         （格式 G-XXXXXXXXXX），把下面兩處的 G-XXXXXXXXXX 換成你的 ID 即可。
         （評估 ID 是公開資訊，放在前端原始碼是正常且必要的做法。） -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9C8B8ZCL6M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      window.GA4_MEASUREMENT_ID = 'G-9C8B8ZCL6M';
      gtag('js', new Date());
      gtag('config', window.GA4_MEASUREMENT_ID);
      // 安全的自訂事件 helper：GA 未載入（或被擋）時也不會報錯。
      window.trackEvent = function (name, params) {
        try { if (typeof gtag === 'function') gtag('event', name, params || {}); } catch (e) {}
      };
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="movie-discovery" id="movieDiscovery" aria-label="電影選擇">
        <div class="movie-discovery__panel">
          <section class="movie-shelf" aria-labelledby="nowShowingTitle">
            <h2 class="movie-shelf__title" id="nowShowingTitle">正在上映</h2>
            <div class="movie-grid" id="nowShowingGrid"></div>
          </section>

          <section class="movie-shelf" aria-labelledby="comingSoonTitle">
            <h2 class="movie-shelf__title" id="comingSoonTitle">即將上映</h2>
            <div class="movie-grid" id="comingSoonGrid"></div>
            <p class="movie-grid-empty" id="comingSoonEmpty" hidden>近 7 天暫無新片</p>
          </section>
        </div>
        <div class="movie-discovery__toast" id="movieDiscoveryToast" role="status" aria-live="polite" hidden>尚未有上映資訊</div>

        <div class="movie-choice-dialog" id="movieNoTodayDialog" aria-hidden="true" hidden>
          <div class="movie-choice-dialog__card" role="dialog" aria-modal="true" aria-labelledby="movieNoTodayTitle">
            <p class="movie-choice-dialog__title" id="movieNoTodayTitle">今日已無上映場次</p>
            <p class="movie-choice-dialog__question">是否看其他日期？</p>
            <div class="movie-choice-dialog__actions">
              <button class="movie-choice-dialog__button movie-choice-dialog__button--ghost" id="movieNoTodayNo" type="button">否，回到選片</button>
              <button class="movie-choice-dialog__button movie-choice-dialog__button--primary" id="movieNoTodayYes" type="button">是，進入地圖</button>
            </div>
          </div>
        </div>
      </section>
      <aside class="sidebar" aria-label="影城篩選">
        <div class="grabber" aria-hidden="true"></div>
        <header class="panel-head">
          <div>
            <h1>
              <img class="brand-logo" src="assets/brand-logo.svg" alt="日本動畫電影上映地圖" />
            </h1>
            <p id="summaryText">載入中</p>
          </div>
        </header>

        <nav class="date-chips" id="dateChips" aria-label="選擇場次日期"></nav>

        <!-- 手機分段控制（電影／地區／時間／版本／影城）：只在手機顯示 -->
        <div class="m-seg" id="mSeg" role="tablist" aria-label="篩選分類">
          <button type="button" role="tab" data-tab="movie">電影</button>
          <button type="button" role="tab" data-tab="city">地區</button>
          <button type="button" role="tab" data-tab="time">時間</button>
          <button type="button" role="tab" data-tab="format">版本</button>
          <button type="button" role="tab" data-tab="chain">影城</button>
        </div>

        <label class="field" id="movieField">
          <span>電影</span>
          <select id="movieSelect" aria-label="選擇電影"></select>
        </label>

        <!-- 手機電影清單（片名＋場次，單選）：只在手機的「電影」分頁顯示 -->
        <section class="m-panel" id="mMoviePanel" aria-label="選擇電影">
          <div class="filter-head"><span>電影</span></div>
          <div class="m-movie-list" id="mMovieList"></div>
        </section>

        <label class="field" id="searchField">
          <span>搜尋</span>
          <div class="search-box">
            <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.5" y2="16.5" />
            </svg>
            <input id="searchInput" type="search" autocomplete="off" placeholder="影城、品牌、縣市" aria-controls="searchSuggestions" />
            <button class="search-clear" id="clearSearchButton" type="button" aria-label="清除搜尋" hidden>✕</button>
          </div>
        </label>
        <div id="searchSuggestions" class="search-suggestions" hidden></div>

        <!-- 手機與桌機共用的時間面板；手機在「時間」分頁顯示，桌機固定顯示於側欄 -->
        <section class="m-panel" id="timeFilterPanel" aria-label="時間篩選">
          <div class="m-time-head">
            <span>現在可看場次</span>
            <span class="m-time-cap" id="timeFilterCaption">載入現在時間</span>
          </div>
          <div class="m-slider" id="timeSlider">
            <div class="m-track">
              <div class="m-fill" id="timeSliderFill"></div>
              <button class="m-knob" id="timeSliderKnob" type="button" aria-label="拖曳選擇最早場次時間">--:--</button>
            </div>
          </div>
          <div class="filter-head"><span>快速時段</span></div>
          <div class="m-period" id="timePeriodButtons">
            <button type="button" data-period="all" class="is-selected">全天</button>
            <button type="button" data-period="morning">上午</button>
            <button type="button" data-period="afternoon">下午</button>
            <button type="button" data-period="evening">晚上</button>
          </div>
        </section>

        <div class="sheet-body" id="sheetBody">
          <section class="filter-block" id="cityBlock" aria-label="縣市篩選">
            <div class="filter-head">
              <span>縣市</span>
            </div>
            <div class="filter-scroll" id="cityFilterList"></div>
          </section>

          <section class="filter-block" id="formatBlock" aria-label="電影版本篩選">
            <div class="filter-head">
              <span>版本</span>
            </div>
            <div class="filter-scroll" id="formatFilterList"></div>
          </section>

          <section class="filter-block" id="chainBlock" aria-label="品牌篩選">
            <div class="filter-head">
              <span>品牌</span>
            </div>
            <div class="filter-scroll" id="chainFilterList"></div>
          </section>
        </div>

        <footer class="sidebar-note" aria-label="場次資訊說明">
          <p>場次資訊持續更新中</p>
          <p>實際上映與售票狀況請以影城官方資訊為準。</p>
        </footer>
      </aside>

      <section class="map-wrap" aria-label="台灣影城地圖">
        <div id="map"></div>

        <!-- 手機搜尋列（浮在地圖上方）：只在手機顯示 -->
        <div class="m-search" id="mSearch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.5" y2="16.5" />
          </svg>
          <input id="mSearchInput" type="search" autocomplete="off" placeholder="搜尋影城、品牌、縣市" aria-controls="mSearchSuggestions" />
          <button class="m-search-clear" id="mSearchClear" type="button" aria-label="清除搜尋" hidden>✕</button>
        </div>
        <div id="mSearchSuggestions" class="m-suggestions" hidden></div>
      </section>

      <!-- 手機影城資訊底部 sheet（點 logo 開啟，佔畫面 70%，地圖留 30%）：只在手機顯示 -->
      <div class="m-sheet" id="mSheet" aria-hidden="true">
        <div class="m-sheet-card" role="dialog" aria-label="影城資訊">
          <div class="m-sheet-grab" aria-hidden="true"></div>
          <button class="m-sheet-close" id="mSheetClose" type="button" aria-label="關閉">✕</button>
          <div class="m-sheet-body" id="mSheetBody"></div>
        </div>
      </div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="runtime-config.js?v=20260903a"></script>
    <script src="carto-basemap-auth.js?v=20260903a"></script>
    <script src="time-filter.js?v=20260812a"></script>
    <script src="date-state.js?v=20260812a"></script>
    <script src="version-filter.js?v=20260925a"></script>
    <script src="app.js?v=20260926b"></script>
    <script src="empty-state.js?v=20260820a"></script>
    <script src="discovery.js?v=20260926b"></script>
  </body>
</html>
